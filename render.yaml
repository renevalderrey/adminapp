# ══════════════════════════════════════════════════════════════
#  Favalio · Render Blueprint
#
#  Despliega la API. El frontend (apps/web) y la landing (apps/landing)
#  van en Vercel — ver apps/*/vercel.json.
#
#  Uso: Render Dashboard -> New -> Blueprint -> apuntar a este repo.
#  Los secrets marcados sync:false se cargan a mano en el dashboard; no
#  se versionan.
# ══════════════════════════════════════════════════════════════

services:
  - type: web
    name: favalio-api
    runtime: docker
    plan: free
    region: oregon
    # ⚠ El contexto de build es LA RAÍZ del repositorio, no `apps/api`.
    #
    # Antes decía `rootDir: apps/api` y funcionaba, porque cada app tenía su
    # propio `package-lock.json`. Desde que el monorepo usa workspaces el
    # lockfile es uno solo y vive arriba, junto con `packages/precios` y
    # `packages/pedido`: con el contexto en `apps/api`, el primer
    # `COPY package.json package-lock.json ./` del Dockerfile no encuentra los
    # archivos y el build falla antes de instalar una sola dependencia.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Solo redeploya si cambio la API. Sin esto, cada push a la landing
    # reconstruiria el backend.
    buildFilter:
      paths:
        - apps/api/**
        # Los paquetes compartidos y el lockfile entran a la imagen: un cambio
        # en `@favalio/precios` o `@favalio/pedido` que no redesplegara la API
        # dejaría el cálculo del navegador y el del servidor en versiones
        # distintas, que es la falla más difícil de ver de todas.
        - packages/**
        - package.json
        - package-lock.json
    # /api/health verifica que se pueda consultar la base, no solo que el
    # proceso responda. Con /api/ping el servicio figuraba SANO aunque Postgres
    # estuviera caido y cada request devolviera 500.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # ── Base de datos ──
      # Neon durante desarrollo. Usar el connection string *pooled*
      # (el host termina en -pooler): Neon free autosuspende y el pooler
      # maneja mejor la reconexion.
      - key: DATABASE_URL
        sync: false

      # ── Auth0 ──
      # Sin estas dos el server aborta al arrancar (ver REQUIRED_ENV).
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false

      # ── Origenes permitidos por CORS ──
      # Lista separada por comas: app + landing.
      # Ej: https://app.favalio.com,https://favalio.com
      - key: ALLOWED_ORIGINS
        sync: false
      # URL de la app, usada tambien en los links de los emails.
      - key: FRONTEND_URL
        sync: false
      # Opcional: regex para habilitar los deploy previews de Vercel.
      # Ej: ^https://favalio-web-.*\.vercel\.app$
      - key: VERCEL_PREVIEW_PATTERN
        sync: false

      # ── La tienda pública ──
      #
      # De dónde saca la API el `index.html` al que le inyecta las etiquetas
      # Open Graph antes de responder `/c/:slug`. El defecto del código es
      # `http://tienda`, que es el nombre del servicio en el compose del VPS y
      # acá no resuelve: sin esta variable, cada enlace de catálogo devuelve el
      # 503 «Volvemos en un rato» con el resto del sistema sano.
      #
      # Va el dominio público de la tienda (Vercel), ej.
      # https://tienda.favalio.com. No hay ciclo: los rewrites de Vercel mandan
      # `/c/*` a la API, pero `/index.html` lo sirve el bundle estático.
      - key: URL_DE_LA_TIENDA
        sync: false

      # ── Fotos de productos ──
      #
      # En el VPS las sirve Caddy desde un volumen y la API no las toca. Acá no
      # hay Caddy ni volumen: sin esto, cada miniatura del panel y cada foto de
      # la tienda son un 404 aunque el dato en la base esté bien.
      #
      # ⚠ El disco de Render free es EFÍMERO: cada deploy y cada reinicio se
      # lleva las fotos subidas, y la base queda apuntando a archivos que ya no
      # existen. Sirve para probar en línea; para un comercio real hace falta un
      # disco persistente (plan pago) o el VPS.
      - key: SERVIR_IMAGENES
        value: "true"
      - key: RUTA_DE_IMAGENES
        value: /var/favalio/imagenes

      # ── Email transaccional (Resend) ──
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # ── TiendaNube (opcional) ──
      - key: TIENDANUBE_CLIENT_ID
        sync: false
      - key: TIENDANUBE_CLIENT_SECRET
        sync: false

      # ── Extraccion de productos por IA (opcional) ──
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Disparador externo de tareas programadas ──
      # El cron de suscripciones corre con setInterval dentro del proceso, y en
      # el free tier el servicio duerme a los 15 min sin trafico: los
      # vencimientos y los avisos no se procesan de forma confiable.
      #
      # Con este secreto configurado se habilita POST /api/tareas/ejecutar, que
      # un cron externo gratuito (cron-job.org, GitHub Actions) puede llamar una
      # vez por dia mandando la cabecera X-Cron-Secret. La peticion ademas
      # despierta el servicio.
      #
      # Sin la variable, el endpoint responde 404: no queda una ruta abierta
      # por olvido.
      - key: CRON_SECRET
        sync: false

# ── Notas del free tier ──
#
# El servicio duerme tras 15 min sin trafico; el primer request despues
# tarda ~50s. Por eso el timeout de axios en apps/web esta en 60s.
#
# Con el servicio dormido, subscriptionCron no corre. Los vencimientos de
# suscripcion no se procesan de forma confiable hasta que haya plan pago
# o un cron job externo.
#
# Las migraciones corren en el CMD del Dockerfile al arrancar. Sirve con
# una sola instancia; al escalar hay que moverlas a un pre-deploy job.
