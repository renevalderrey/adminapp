# nginx para servir la SPA ya buildeada.
# Solo se usa en Railway/self-host; en Vercel el serving es nativo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: react-router maneja las rutas del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, asi que se pueden cachear para siempre.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es lo que apunta a los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # NOTA: aca habia un proxy /api/ hacia http://backend:5000, que era el
    # nombre de servicio del docker-compose que se elimino. nginx resuelve ese
    # hostname al cargar la config y aborta si no existe, con lo cual el
    # contenedor no arrancaba fuera de compose.
    # No hace falta proxy: el frontend llama a la API por URL absoluta
    # (VITE_API_URL) y la API la habilita por CORS.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
