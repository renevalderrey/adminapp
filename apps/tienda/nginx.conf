# nginx para servir la tienda ya buildeada.
#
# Copia del de `apps/web`, con una diferencia que importa y está explicada abajo
# (el fallback de SPA). El resto es igual a propósito: el mismo cacheo de assets
# con hash, el mismo `no-cache` en index.html, el mismo gzip.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: el ruteo de las cinco pantallas lo hace `App.jsx` del
    # lado del cliente.
    #
    # ⚠ En producción **este fallback casi no se usa**: `/c/:slug` y `/c/:slug/*`
    # los sirve la API, porque es la que reemplaza el marcador `<!--FAVALIO_META-->`
    # del `<head>` por las etiquetas Open Graph de ese catálogo (Caddy manda esas
    # rutas a `api:5000`). Este bloque cubre el resto: `/carrito`, `/checkout`,
    # `/confirmado/:numero` y cualquier recarga de una ruta del cliente que no
    # cuelgue de `/c/`. Si algún día alguien lo borra por «no hace falta»,
    # recargar el carrito devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, asi que se pueden cachear para siempre.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es lo que apunta a los assets nuevos. Acá hay
    # un segundo motivo que en `apps/web` no existe: el documento se sirve
    # personalizado por catálogo, y una copia cacheada mostraría las etiquetas de
    # otro comercio.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # NOTA: acá NO va un proxy hacia la API, igual que en `apps/web` y por un
    # motivo parecido: nginx resuelve el hostname al cargar la config y aborta si
    # no existe, con lo cual el contenedor no arranca fuera de compose.
    # El proxy de `/api/publico/*` lo hace Caddy, adelante, en el mismo origen —
    # que es lo que le permite a la tienda pedir con rutas relativas y sin CORS.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
