name: CI

# No habia ningun workflow: el repo solo tenia una plantilla de pull request.
# Nada corria los tests, nada verificaba que las apps buildearan, y nada
# comprobaba que la imagen de Docker arrancara.
#
# Eso permitio que llegara a main un Dockerfile que no podia levantar el
# contenedor: sequelize-cli buscaba las migraciones en un directorio que no
# existe en la imagen, salia con codigo 1, y el && del CMD cortaba antes de
# arrancar el servidor. Un docker build + run lo habria mostrado enseguida.

on:
  push:
    branches: [main, chore/monorepo]
  pull_request:
  # A pedido, sin tener que empujar un commit vacio.
  #
  # Hizo falta el 6/8/2026: Actions estuvo caido un rato —«Failed to resolve
  # action download info: Service Unavailable»— y tres corridas quedaron en rojo
  # sin haber ejecutado una sola linea de codigo, mas un push que directamente no
  # genero corrida. Sin esto, la unica forma de volver a pedirla es un commit que
  # no cambia nada, que despues queda para siempre en el historial confundiendo a
  # quien lo lea.
  #
  # Y sirve para lo otro: un rojo que no se puede repetir no se puede distinguir
  # de uno intermitente.
  workflow_dispatch:

jobs:
  api:
    name: API — tests
    runs-on: ubuntu-latest

    # ════════════════════════════════════════════
    #  Postgres real, para los tests de integración (proyecto 5c)
    #
    #  Es el mismo servicio que ya tenían los jobs `contenedor` y `navegador`:
    #  se replica acá porque este es el job donde corren los tests, y hasta
    #  ahora la suite de la API no podía tocar una base. Los 1400 tests con
    #  dobles siguen corriendo sin él —arrancan igual, sin esperar a nada— y
    #  los de integración corren después, en su propio paso.
    #
    #  La base se llama `favalio_integracion` a propósito: el arnés se niega
    #  a truncar una base cuyo nombre no diga que es de prueba.
    # ════════════════════════════════════════════
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: favalio
          POSTGRES_PASSWORD: favalio
          POSTGRES_DB: favalio_integracion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Workspaces: se instala el monorepo entero desde la raiz, una sola vez.
      - run: npm ci

      # Los rápidos primero: son un minuto y medio y cubren casi todo. Si algo
      # se rompió acá, no tiene sentido esperar a que migre una base.
      - name: Tests
        run: npm test
        working-directory: apps/api
        env:
          NODE_ENV: test

      # `test:integracion` aplica las migraciones y recién después corre jest.
      # Si Postgres no estuviera, FALLA con el comando que hay que correr — no
      # se saltea: un test que se saltea en silencio es un test que deja de
      # correr y nadie se entera.
      - name: Tests de integración contra Postgres
        run: npm run test:integracion
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgresql://favalio:favalio@localhost:5432/favalio_integracion

  web:
    name: Web — tests y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      # El bypass de sesión de las pruebas de navegador NO se puede compilar: el
      # alias de `vite.config.js` exige `command === 'serve'`. Esto lo verifica
      # sobre el producto terminado, que es lo que se le sirve al navegador de un
      # cliente. Va acá y no en `npm test` porque en un clon recién bajado no hay
      # `dist/` que mirar, y una guardia que se saltea sola no es una guardia.
      - name: El bundle no tiene el bypass de sesión
        run: npm run verificar:bundle
        working-directory: apps/web

  # ════════════════════════════════════════════
  #  Paquetes compartidos
  #
  #  Job propio, y no un paso del job `web`, por el nombre. La fórmula del
  #  precio la usan el punto de venta, el inventario y —desde el hito 10— el
  #  catálogo público. Colgada de «Web — tests», una regresión que rompe el
  #  precio que ve un cliente en la calle se reporta como si fuera un problema
  #  de la aplicación de escritorio, y el nombre del job es la mitad del valor
  #  de un CI: es lo único que se lee antes de decidir a quién le toca mirar.
  #
  #  Son milisegundos: el paquete es aritmética y corre en `environment: node`.
  # ════════════════════════════════════════════
  paquetes:
    name: Paquetes — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test -w packages/precios

  # ════════════════════════════════════════════
  #  Pruebas de navegador
  #
  #  ── Por qué es un job propio y no un paso del job `web` ──
  #
  #  Playwright se baja un Chromium de 115 MB y necesita un Postgres y la API
  #  levantada: son tres o cuatro minutos contra el minuto y medio del job de
  #  tests. Metido adentro de `web`, cada push esperaría eso para saber si un
  #  test unitario falló. Como job aparte corre EN PARALELO con los otros
  #  cuatro, así que no alarga el camino crítico: el CI sigue tardando lo que
  #  tarda el más lento.
  #
  #  ── Por qué corre en cada push y no a pedido ──
  #
  #  Porque lo que atrapa es exactamente lo que se cuela sin que nadie lo mire.
  #  El contenedor de scroll de las diecisiete pantallas se movió en el hito 5 y
  #  pasó un hito entero sin que nadie lo notara: `npm run build` no lo ve,
  #  vitest tampoco —jsdom devuelve cero en todo lo que mida— y la revisión de
  #  código no distingue `mx-auto max-w-[1320px] overflow-y-auto` de dos divs.
  #  Una verificación que hay que acordarse de correr es una que no se corre, y
  #  esa es la historia de los cinco pasos manuales que originaron esto.
  # ════════════════════════════════════════════
  navegador:
    name: Web — pruebas de navegador
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: favalio
          POSTGRES_PASSWORD: favalio
          POSTGRES_DB: favalio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://favalio:favalio@localhost:5432/favalio_e2e
      DB_SSL: 'false'
      FAVALIO_API_DE_PRUEBAS: http://localhost:5099/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Un solo npm ci: los workspaces instalan api y web juntos.
      - run: npm ci

      # El Chromium se cachea por versión de Playwright: sin esto son 115 MB de
      # descarga en cada corrida. La clave sale del package-lock, así que se
      # invalida sola cuando Playwright sube de versión — que es cuando el
      # navegador cacheado deja de servir.
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - uses: actions/cache@v4
        id: cache-navegadores
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Bajar Chromium
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Las dependencias del sistema no van en el cache: son paquetes de apt.
      - name: Dependencias del sistema para Chromium
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      # Las migraciones PRIMERO, y despues el arranque en desarrollo.
      #
      # Antes este paso no existia: la base arrancaba vacia y el esquema lo
      # creaba el `sequelize.sync({ alter: true })` del arranque, porque sobre
      # una base migrada ese mismo sync se caia — ocho columnas eran `ENUM` en
      # los modelos y `VARCHAR` en las migraciones, y convertirlas mata el
      # proceso. Ese era el sintoma del proyecto 0.
      #
      # Con el esquema convergido, correr las dos cosas seguidas deja de ser
      # posible y pasa a ser LA VERIFICACION: si alguien vuelve a agregar una
      # columna al modelo sin su migracion, el sync la encuentra distinta y este
      # job se cae. Sin este paso, esa divergencia solo se descubre el dia que
      # alguien intenta levantar una base nueva.
      - name: Migrar la base del navegador
        run: node scripts/migrar.js
        working-directory: apps/api

      # El arranque en desarrollo siembra permisos, la empresa 1, sus sucursales
      # y el usuario `test-user-id`, que es lo que las pruebas necesitan.
      - name: Levantar la API con BYPASS_AUTH
        run: |
          # Los dos AUTH0_* van aunque BYPASS_AUTH este activo, y no porque
          # hagan falta: `middleware/auth.js` ya no construye el verificador con
          # bypass. Van como red — si alguien saca el bypass de este paso, el
          # servidor arranca y la falla se ve en las pruebas, no en noventa
          # segundos de espera y un ERR_ASSERTION que no nombra a Auth0.
          # Las dos de TiendaNube van porque `GET /api/tiendanube/status`
          # responde `sin_configurar` SIN MIRAR NINGUNA FILA cuando falta
          # TIENDANUBE_CLIENT_ID —que es lo correcto: sin credenciales no hay
          # integracion posible—. En una maquina con apps/api/.env eso no se
          # nota; en CI no hay .env, y la prueba de la pantalla fallaba diciendo
          # «se sembro la tienda pero /status no la ve», que suena a un problema
          # de la siembra y no a una variable que falta.
          #
          # Son valores de mentira a proposito: no se habla con TiendaNube en
          # ninguna prueba. Lo unico que hacen es que el endpoint mire la base.
          NODE_ENV=development BYPASS_AUTH=true PORT=5099 \
            AUTH0_DOMAIN=ci.example.com AUTH0_AUDIENCE=https://ci.example.com/api \
            TIENDANUBE_CLIENT_ID=ci-cliente TIENDANUBE_CLIENT_SECRET=ci-secreto \
            ALLOWED_ORIGINS=http://localhost:5199 LOG_LEVEL=warn \
            node src/server.js > /tmp/api-navegador.log 2>&1 &

          for i in $(seq 1 45); do
            if curl -sf http://localhost:5099/api/health > /dev/null; then
              echo "La API respondió."
              exit 0
            fi
            sleep 2
          done

          echo "La API no respondió en 90s."
          cat /tmp/api-navegador.log
          exit 1
        working-directory: apps/api

      # Seis de las diecisiete pantallas son de módulos no liberados y redirigen
      # a /pos si quien mira no es superadmin. Sin esto, la prueba del marco
      # estaría midiendo /pos seis veces sin que nada avise.
      - name: El usuario de pruebas es operador de la plataforma
        run: node scripts/superadmin.js activar dev@favalio.com
        working-directory: apps/api

      - name: Pruebas de navegador
        run: npx playwright test
        working-directory: apps/web

      - name: Reporte y trazas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-informe
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Log de la API si algo falló
        if: failure()
        run: cat /tmp/api-navegador.log || true

  # ════════════════════════════════════════════
  #  La tienda pública
  #
  #  ── Por qué es un job propio y NO dos pasos más adentro de `navegador` ──
  #
  #  Porque `navegador` ya es el job más lento del CI —Chromium, un Postgres y
  #  la API arriba— y agregarle un segundo servidor de desarrollo y un segundo
  #  recorrido lo pone en el camino crítico de **cada push**: todo el mundo
  #  esperaría esos minutos extra para saber si un test unitario falló. Como job
  #  aparte corre EN PARALELO con los otros seis, así que el CI sigue tardando lo
  #  que tarda el más lento y no la suma de los dos.
  #
  #  Y hay una segunda razón, que es la misma por la que `paquetes` no cuelga de
  #  `web`: el nombre. Una regresión en el ancho de la tienda es un catálogo roto
  #  en el teléfono de alguien parado en la puerta de un gimnasio; reportada como
  #  «Web — pruebas de navegador» manda a mirar la aplicación de escritorio.
  #
  #  ── Y por qué no comparte NADA del arnés de `apps/web` ──
  #
  #  Aquel arnés existe alrededor del bypass de sesión, y la tienda no tiene
  #  sesión que falsear: el porqué completo está en el encabezado de
  #  `apps/tienda/playwright.config.js`. Lo que se ve acá son las consecuencias:
  #  no hace falta `ALLOWED_ORIGINS` —la tienda habla contra su propio origen, no
  #  hay CORS—, no hace falta `TIENDANUBE_CLIENT_ID`, y no hace falta activar el
  #  superadmin, porque ninguna pantalla de la tienda está detrás de un módulo.
  # ════════════════════════════════════════════
  tienda:
    name: Tienda — tests y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: favalio
          POSTGRES_PASSWORD: favalio
          POSTGRES_DB: favalio_tienda_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://favalio:favalio@localhost:5432/favalio_tienda_e2e
      DB_SSL: 'false'
      # El origen de la API descartable, SIN `/api`: es el destino del `proxy` de
      # `apps/tienda/vite.config.js`, que es lo que hace de Caddy en desarrollo.
      # El 5098 es propio, y no el 5099 de `navegador`, para que las dos suites
      # se puedan levantar a la vez en una máquina de trabajo.
      FAVALIO_ORIGEN_DE_LA_API: http://localhost:5098

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # El cache es lo único que no se copió de `navegador`, que no lo tiene:
          # los otros cuatro jobs sí, y ahorra la instalación completa del
          # monorepo en cada corrida.
          cache: npm
          cache-dependency-path: package-lock.json

      # Un solo npm ci: los workspaces instalan api y tienda juntos.
      - run: npm ci

      # ── Los dos pasos baratos primero ──
      #
      # Es el criterio del job `api` («los rápidos primero»): el build y los 134
      # tests con jsdom son medio minuto y cubren casi todo. Si algo se rompió
      # ahí, no tiene sentido esperar a que se baje un Chromium y migre una base.
      - name: Build
        run: npm run build -w apps/tienda

      - name: Tests
        run: npm test -w apps/tienda

      # El Chromium se cachea por versión de Playwright. La clave es LA MISMA que
      # la del job `navegador` a propósito: las dos apps declaran la misma
      # versión, así que es el mismo navegador y bajarlo dos veces sería pagar
      # 115 MB por gusto. La clave sale del package-lock, así que se invalida
      # sola cuando Playwright sube de versión.
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/tienda

      - uses: actions/cache@v4
        id: cache-navegadores
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Bajar Chromium
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/tienda

      # Las dependencias del sistema no van en el cache: son paquetes de apt.
      - name: Dependencias del sistema para Chromium
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/tienda

      # Las migraciones PRIMERO y el arranque en desarrollo después, igual que en
      # `navegador` y por el mismo motivo: correr las dos cosas seguidas es LA
      # verificación de que el esquema de los modelos y el de las migraciones no
      # divergieron. Si alguien agrega una columna al modelo sin su migración, el
      # `sequelize.sync({ alter: true })` del arranque la encuentra distinta y
      # este job se cae.
      - name: Migrar la base de la tienda
        run: node scripts/migrar.js
        working-directory: apps/api

      # El arranque en desarrollo siembra los permisos, la empresa 1, sus tres
      # sucursales y **la suscripción en `trialing`** (`src/setup.js:47-63`). Esa
      # última es la que hace falta acá y en ningún otro job: sin fila de
      # suscripción, `GET /api/publico/c/:slug` responde `no_disponible` y la
      # tienda dibuja el estado neutro en vez del catálogo.
      - name: Levantar la API con BYPASS_AUTH
        run: |
          # Los dos AUTH0_* van aunque BYPASS_AUTH esté activo, como red: si
          # alguien saca el bypass de este paso, el servidor arranca igual y la
          # falla se ve en las pruebas y no en noventa segundos de espera.
          NODE_ENV=development BYPASS_AUTH=true PORT=5098 \
            AUTH0_DOMAIN=ci.example.com AUTH0_AUDIENCE=https://ci.example.com/api \
            LOG_LEVEL=warn \
            node src/server.js > /tmp/api-tienda.log 2>&1 &

          for i in $(seq 1 45); do
            if curl -sf http://localhost:5098/api/health > /dev/null; then
              echo "La API respondió."
              exit 0
            fi
            sleep 2
          done

          echo "La API no respondió en 90s."
          cat /tmp/api-tienda.log
          exit 1
        working-directory: apps/api

      # `globalSetup` siembra el catálogo publicado y sus tres productos, y el
      # `webServer` levanta `vite --port 5175 --strictPort`. Los dos salen de
      # `apps/tienda/playwright.config.js`.
      - name: Pruebas de navegador
        run: npx playwright test
        working-directory: apps/tienda

      - name: Reporte y trazas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-informe-tienda
          path: |
            apps/tienda/playwright-report/
            apps/tienda/test-results/
          retention-days: 7

      - name: Log de la API si algo falló
        if: failure()
        run: cat /tmp/api-tienda.log || true

  landing:
    name: Landing — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        working-directory: apps/landing

  contenedor:
    name: API — la imagen arranca y migra
    runs-on: ubuntu-latest

    # Postgres real: es la unica forma de comprobar que las migraciones
    # efectivamente corren dentro del contenedor. Los tests usan modelos
    # falsos y no habrian detectado el problema del path.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: favalio
          POSTGRES_PASSWORD: favalio
          POSTGRES_DB: favalio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # El contexto es la raiz: el package-lock.json del monorepo vive arriba.
      # El .dockerignore que aplica es el de la raiz — si este paso empieza a
      # tardar de mas, es ese archivo lo primero que hay que mirar.
      - name: Construir la imagen
        run: docker build -f apps/api/Dockerfile -t favalio-api:ci .

      - name: Aplicar las migraciones dentro del contenedor
        run: |
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL='postgresql://favalio:favalio@localhost:5432/favalio_ci' \
            -e DB_SSL=false \
            favalio-api:ci \
            node scripts/migrar.js

      # Migrar y arrancar no dicen nada del esquema: una base sin las tablas de
      # permisos levantaba igual, con el health check en verde, y quedaba
      # inservible. Este paso hace una consulta real por cada modelo — si falta
      # una tabla o una columna, se cae acá y no tres meses después.
      - name: El esquema migrado sirve (una consulta por modelo)
        run: |
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL='postgresql://favalio:favalio@localhost:5432/favalio_ci' \
            -e DB_SSL=false \
            favalio-api:ci \
            node scripts/verificar-esquema.js

      - name: El servidor levanta y responde el health check
        run: |
          docker run -d --name api-ci --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL='postgresql://favalio:favalio@localhost:5432/favalio_ci' \
            -e DB_SSL=false \
            -e AUTH0_DOMAIN=ci.example.com \
            -e AUTH0_AUDIENCE=https://ci.example.com/api \
            -e PORT=5000 \
            favalio-api:ci

          # Margen para el arranque: migraciones + conexion + seeds.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "El health check respondio."
              docker logs api-ci
              exit 0
            fi
            sleep 2
          done

          echo "El servidor no respondio en 60s."
          docker logs api-ci
          exit 1

      - name: Logs del contenedor si algo fallo
        if: failure()
        run: docker logs api-ci || true
